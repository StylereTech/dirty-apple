name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [server, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Backend regression and database tests
        if: matrix.project == 'server'
        run: npm test
        env:
          RUN_MONGO_TESTS: '1'
      - name: Frontend regression tests
        if: matrix.project == 'frontend'
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Dependency security audit
        run: npm audit --audit-level=high
